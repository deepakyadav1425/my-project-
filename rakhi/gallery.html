<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .gallery-section {
            padding: 30px 15px;
            text-align: center;
        }

        .gallery-section h2 {
            color: #e91e63;
            margin-bottom: 25px;
            font-size: 28px;
        }

        /* Gallery */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
            max-width: 1000px;
            margin: auto;
        }

        .gallery img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
        }

        .gallery img:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(233, 30, 99, 0.4);
        }

        /* Full Image Popup */
        .image-modal {
            display: none;
            position: fixed;
            z-index: 9999;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .full-image {
            max-width: 95%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 10px;
            animation: zoomIn 0.3s ease;
        }

        .close {
            position: absolute;
            top: 15px;
            right: 30px;
            color: white;
            font-size: 45px;
            cursor: pointer;
            z-index: 10000;
        }

        @keyframes zoomIn {
            from {
                transform: scale(0.7);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Mobile */
        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: repeat(3, 1fr);
                gap: 7px;
            }

            .gallery img {
                height: 100px;
            }

            .full-image {
                max-width: 100%;
                max-height: 85vh;
            }
        }
    </style>
</head>

<body>


    <section class="gallery-section">
        <h2>📸 Our Memories</h2>

        <div class="gallery">
            <img src="img/1.jpg" alt="Memory 1" onclick="openImage(this)">
            <img src="img/2.jpg" alt="Memory 2" onclick="openImage(this)">
            <img src="img/3.jpg" alt="Memory 3" onclick="openImage(this)">
            <img src="img/4.jpg" alt="Memory 4" onclick="openImage(this)">
            <img src="img/5.jpg" alt="Memory 5" onclick="openImage(this)">
            <img src="img/6.jpg" alt="Memory 6" onclick="openImage(this)">
            <img src="img/7.jpg" alt="Memory 7" onclick="openImage(this)">
            <img src="img/8.jpg" alt="Memory 8" onclick="openImage(this)">
            <img src="img/9.jpg" alt="Memory 8" onclick="openImage(this)">
            <img src="img/10.jpg" alt="Memory 8" onclick="openImage(this)">
        </div>
    </section>

    <!-- Full Image Popup -->
    <div id="imageModal" class="image-modal" onclick="closeImage()">
        <span class="close">&times;</span>
        <img id="fullImage" class="full-image">
    </div>







    <script>
        function openImage(img) {
            const modal = document.getElementById("imageModal");
            const fullImage = document.getElementById("fullImage");

            modal.style.display = "flex";
            fullImage.src = img.src;
        }

        function closeImage() {
            document.getElementById("imageModal").style.display = "none";
        }
    </script>

</body>

</html>
